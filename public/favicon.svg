<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Soft teal glow for the white card -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#46B8B4" flood-opacity="0.12" />
    </filter>
    
    <!-- Vibrant Teal Gradient for the Arrow -->
    <linearGradient id="arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#46B8B4" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
  </defs>

  <!-- White Card with rounded corners and soft glow -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="#FFFFFF" stroke="#E6F4F3" stroke-width="2" filter="url(#card-shadow)" />
  
  <!-- Outer Logo Circle -->
  <circle cx="64" cy="64" r="26" stroke="#374151" stroke-width="4.5" fill="none" stroke-linecap="round" />
  
  <!-- Inner Letter M -->
  <path d="M 51 74 L 51 54 L 64 67 L 77 54 L 77 74" stroke="#374151" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Diagonal Teal Arrow -->
  <!-- Line from bottom-left outer circle to top-right outer circle -->
  <path d="M 44 84 L 84 44" stroke="url(#arrow-grad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  
  <!-- Arrow Head pointing top-right -->
  <path d="M 72 44 L 84 44 L 84 56" stroke="url(#arrow-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
