<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main
    data-composition-id="{{ composition_id }}"
    data-start="0"
    data-duration="{{ duration }}"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <div class="composition-grain"></div>

    <div class="composition-brand">
      <div class="brand-mark">▶</div>
      <span>{{ title }}</span>
    </div>

    <div class="composition-topic">{{ course }} · {{ topic }}</div>

    {{ scenes_html }}
    {{ audio_html }}
  </main>

  <script src="./assets/vendor/gsap.min.js"></script>
  <script src="./runtime.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    const SceneClock = {{ scene_clock_json }};

    function T(sceneId, localTime) {
      return (SceneClock[sceneId] || 0) + localTime;
    }

    {{ timeline_js }}

    window.__timelines["{{ composition_id }}"] = tl;
  </script>
</body>
</html>
