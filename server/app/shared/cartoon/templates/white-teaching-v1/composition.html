<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="layout.css">
  </head>
  <body>
    <main class="clip" data-composition-id="{{ composition_id }}" data-start="0" data-duration="{{ duration }}" data-width="1920" data-height="1080">
      <div class="scenes">{{ scenes_html }}</div>
      <section data-slot="captions" aria-live="polite">{{ captions_html }}</section>
      <footer data-slot="progress"><span id="cartoon-progress" data-progress-fill></span></footer>
      <div class="audio-track">{{ audio_html }}</div>
    </main>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      if (!window.gsap) {
        document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"><\\/script>');
      }
    </script>
    <script src="motion.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["{{ composition_id }}"] = tl;
      {{ timeline_js }}
    </script>
  </body>
</html>
