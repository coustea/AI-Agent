# 应用配置
app:
  host: "127.0.0.1"
  port: 9999

database:
  url: "postgresql+asyncpg://coustea:Aa123456@127.0.0.1:5432/agent"
  echo: false
  pool_size: 20
  max_overflow: 30
  pool_recycle: 1800
  pool_timeout: 30

# JWT 配置
jwt:
  secret_key: "agent-platform-secret-key-2024-min-32-bytes"
  algorithm: "HS256"
  expire_days: 7

# ============ 模型配置 ============
models:
  # 主模型：系统默认调用
  main:
    base_url: "https://maas-coding-api.cn-huabei-1.xf-yun.com/v2"
    api_key: "a878422abe46bb3e7daa03bc71c74539:NGNlNmI4ZDk2YjYyNzUwNmQ5ODQxMzVj"
    model_name: "astron-code-latest"
    max_tokens: 8192
    timeout: 300
    max_retries: 2
    temperature:
      default: 0.7
      json: 0.1
      stream: 1.0

  # 视觉模型：图片理解
  vision:
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key: "a905a82165e24eaea6acbfc22a521872.5i9Hyi99pIEygWWC"
    model_name: "glm-4.6v-flash"
    temperature: 0.7
    timeout: 300
    max_retries: 2

