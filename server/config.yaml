# 搜索服务
search:
  tavily_key: "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"
  spark_key: "fJBSbtdchNCLigLHcEMn:HWSLhFEcXxAItAvgvERb"

# 路径配置
paths:
  workplace: "static"
  logs: "logs"
  knowledge: "app/rag/data/index"

knowledge:
  enabled: true
  embed_model: "bge-m3:latest"
  embed_base_url: "http://127.0.0.1:11434/v1"
  embed_api_key: "ollama"
  top_k: 4
  max_context_chars: 6000

# Memory 压缩与长期记忆
memory:
  # 会话压缩阈值
  compress_keep_recent_messages: 4
  compress_min_messages: 16
  compress_min_tokens: 4000
  summary_context_blocks: 3
  # 画像/长期记忆更新阈值（累积够了就触发）
  update_min_messages: 12
  update_min_tokens: 6000
  # 长期记忆最低置信度
  ltm_min_confidence: 0.75

# Chat 附件与保护机制
chat:
  # 单个文件最大读取字符数，超过则截断
  max_file_content_chars: 15000
  # 单次上传最大文件数量
  max_upload_files: 12
  # 支持的图片扩展名
  image_extensions:
    - png
    - jpg
    - jpeg
    - gif
    - webp
  # 构建对话上下文时拉取的历史消息条数
  history_limit: 20

# 评估配置
evaluation:
  # 连续学习天数判定阈值（秒），每天至少这么多秒才算活跃
  streak_min_seconds: 300

# 路径规划配置
paths_config:
  # 路径节点测验题目数量
  quiz_size: 5
  # 通过测验的最低分数
  pass_score: 3

# ASR 语音识别配置
asr:
  # 当前网络使用 fake-IP DNS；域名鉴权和 TLS SNI 仍保持不变。
  direct_ip: "124.172.152.234"
  # VAD 结束静默时长（毫秒）— 越小响应越快，但可能截断短停顿
  vad_eos: 1200
