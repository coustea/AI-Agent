# 应用配置
app:
  host: "127.0.0.1"
  port: 9999

database:
  url: "mysql+aiomysql://coustea:Aa123456@127.0.0.1:3306/agent"
  echo: false
  pool_size: 20
  max_overflow: 30
  pool_recycle: 1800
  pool_timeout: 30

# JWT 配置
jwt:
  secret_key: "agent-platform-secret-key-2024-min-32-bytes"
  algorithm: "HS256"
  expire_days: 7

# ============ 模型配置 ============
# 全系统统一定义两个模型：文本模型 (text) 与 视觉模型 (vision)
models:
  text:
    base_url: "https://maas-api.cn-huabei-1.xf-yun.com/v2/chat/completions"
    api_key: "ak-b9b6c6935fcc4f06b6a8472af909f383"
    model_name: "spark-x2.6"
    timeout: 300
    max_retries: 2
  vision:
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key: "a905a82165e24eaea6acbfc22a521872.5i9Hyi99pIEygWWC"
    model_name: "glm-4.6v-flash"
    timeout: 300
    max_retries: 2


# 星火 WebSocket API（Vision 用，TTS 也回退到此配置）
# 路径配置
paths:
  workplace: "static"
  logs: "logs"

# Memory 压缩与长期记忆
memory:
  # 会话压缩阈值
  compress_keep_recent_messages: 4
  compress_min_messages: 16
  compress_min_tokens: 4000
  summary_context_blocks: 3
  # 画像/长期记忆更新阈值（累积够了就触发）
  update_min_messages: 12
  update_min_tokens: 6000
  # 长期记忆最低置信度
  ltm_min_confidence: 0.75

# Chat 附件与保护机制
chat:
  # 单次上传最大文件数量
  max_upload_files: 12
  # 构建对话上下文时拉取的历史消息条数
  history_limit: 20

# 路径规划配置
paths_config:
  # 路径节点测验题目数量
  quiz_size: 5
  # 通过测验的最低分数
  pass_score: 3
