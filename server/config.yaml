# 路径配置
paths:
  workplace: "workplace"
  logs: "logs"
  knowledge: "data/chroma_md_db"

knowledge:
  enabled: true
  collection: "md_books"
  embed_model: "bge-m3:latest"
  top_k: 4
  ollama_base_url: "http://127.0.0.1:11434"
# 自己本地ollama的bge-m3模型
# 日志配置
logging:
  level: "INFO"

# Memory 压缩与长期记忆
memory:
  recent_raw_messages: 8
  compress_keep_recent_messages: 4
  compress_min_messages: 14
  compress_min_tokens: 3500
  summary_context_blocks: 3
  ltm_min_messages: 12
  ltm_min_tokens: 3500
  ltm_min_confidence: 0.75
  ltm_cooldown_minutes: 30

# Chat 附件与保护机制
chat:
  # 单个文件最大读取字符数，超过则截断
  max_file_content_chars: 15000
  # 单次文档分析最大文件数量
  max_analyze_file_count: 8
  # 单次文档分析总字符数上限
  max_analyze_total_chars: 40000
  # PDF 最大读取页数
  max_pdf_pages: 80
  # DOCX 最大读取段落数
  max_docx_paragraphs: 1200
  # 单次分析最大图片数量
  max_analyze_images: 8
  # 单次上传最大文件数量
  max_upload_files: 12
  # 支持的图片扩展名
  image_extensions:
    - png
    - jpg
    - jpeg
    - gif
    - webp
  # 构建对话上下文时拉取的历史消息条数
  history_limit: 20
  # 查询 embedding 缓存大小
  query_embedding_cache_size: 500
  # 稀疏检索加载的文档上限
  sparse_corpus_limit: 12000

# 评估配置
evaluation:
  # 连续学习天数判定阈值（秒），每天至少这么多秒才算活跃
  streak_min_seconds: 300

# 路径规划配置
paths_config:
  # 节点估计时长下限（分钟）
  min_estimated_minutes: 10
  # 节点估计时长上限（分钟）
  max_estimated_minutes: 180
  # 路径节点测验题目数量
  quiz_size: 5
  # 通过测验的最低分数
  pass_score: 3

# 资源生成配置
resource:
  # 审核时单个资源内容截断上限（字符数）
  review_content_limit: 12000

# 题库导入配置
quiz:
  # 批量写入的批次大小
  import_batch_size: 200

# ASR 语音识别配置
asr:
  # VAD 结束静默时长（毫秒）
  vad_eos: 1000
