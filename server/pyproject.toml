[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "sqlmodel>=0.0.38",
    "aiomysql>=0.3.2",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "openai>=2.31.0",
    "pyyaml>=6.0.3",
    "pymupdf>=1.27.2.2",
    "python-docx>=1.2.0",
    "markdown>=3.10.2",
    "chromadb>=0.6.3",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "rich>=14.3.3",
    "python-pptx>=1.0.2",
    "fonttools>=4.62.1",
    "greenlet>=3.3.2",
    "uvicorn>=0.44.0",
    "loguru>=0.7.2",
    "httpx>=0.28.1",
    "playwright>=1.59.0",
    "serpapi>=1.0.2",
    "pandas>=3.0.3",
    "xlrd>=2.0.2",
    "beautifulsoup4>=4.14.3",
    "openpyxl>=3.1.5",
    "requests>=2.33.1",
    "mutagen>=1.47.0",
    "pypdf>=6.10.0",
    "pygments>=2.20.0",
    "edge-tts>=7.2.8",
    # RAG 索引侧仍用 LangChain 的纯文档抽象与文本切分（无 LLM 耦合）
    "langchain-core>=1.2.14",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.0.0",
    "defusedxml>=0.7.1",
    "lxml>=6.0.4",
    "markitdown[pptx]>=0.1.9",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-jose>=3.5.0",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
