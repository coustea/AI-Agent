# Mentorly 配置文件
#
# 语法约定：${ENV_KEY} 占位符在加载时由环境变量替换（见 internal/config/config.go）。
# 引用未设置的环境变量会导致启动失败，并明确报出变量名，避免密钥静默为空。

#===============================应用配置===============================
app:
  name: ${APP_NAME}
  env: ${APP_ENV}
  host: ${APP_HOST}
  port: ${APP_PORT}

#===============================日志配置===============================
log:
  # 日志根目录，按日期分目录存放，如 logs/2026-11-20/app.log
  dir: logs
  # debug / info / warn / error
  level: debug
  # 单文件最大体积（MB），超过后分卷
  max_size: 50
  # 每个日期目录最多保留的备份数
  max_backup: 5
  # 是否压缩历史备份
  compress: true

#===============================JWT 配置===============================
jwt:
  # HS256 签名密钥，长度至少 32 字节，否则启动报错
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  # token 有效期，必须带单位：168h / 30m / 7d 不支持。纯数字会被当成纳秒。
  expire: ${JWT_EXPIRE}

#===============================LLM 配置===============================
llm:
  # 模型供应商，目前支持：openai（OpenAI 兼容协议）
  provider: ${LLM_PROVIDER}
  # 模型名称
  model: ${LLM_MODEL}
  # OpenAI 兼容接口的 BaseURL
  base_url: ${LLM_BASE_URL}
  # API Key，留空则不启用 AI 能力（发送消息接口返回 503）
  api_key: ${LLM_API_KEY}
  # 最大输出 Token，0 表示使用服务端默认值。
  # 实测 spark-x2.6 将思考 token 计入 max_tokens，设 32768 为复杂课件/脚本留足余量。
  max_token: 32768
  # 单次模型调用的 HTTP 超时。与 chat.run_timeout(600s) 保持 1:2 配比，
  # 既满足 >= run_timeout/2 校验，也为单次重试/降级留足时间余量。
  timeout: 300s
  # 供应商扩展参数，原样透传
  extra_fields:
    temperature: 0.7

#===============================数据库配置===============================
database:
  mysql:
    database: ${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    # 显式配置则以此为准；留空时由上面三项拼装
    dsn: ${DB_DSN}
    max_idle_conns: 10
    max_open_conns: 100
    conn_max_lifetime: 1h

#===============================TutorAgent 配置===============================
chat:
  # 单条 shell 命令超时
  shell_timeout: 120s
  # Agent 单轮最大 ReAct 迭代步数。
  # 复杂任务（多产物 + 反复调试）实测需要 25-40 步，
  # 12 步会在真正产出前被截断。
  max_steps: 40
  # 单轮生成总超时
  run_timeout: 600s
  # SSE 心跳间隔
  heartbeat: 15s
  # 官方 Reduction Clear 阶段保留最近几轮工具调用，更早轮次触发清理时自动卸载
  history_tool_turns: 2
  # 官方 Reduction Clear 的触发阈值，必须低于 summary_trigger_tokens
  reduce_trigger_tokens: 24000
  # 官方 Summarization Middleware 的触发阈值。
  # 达到任一阈值即把旧对话压成摘要并持久化检查点，原始消息仍完整保留在数据库。
  summary_trigger_tokens: 48000
  summary_trigger_messages: 30


#===============================附件配置===============================
attachments:
  # 附件直接存放在默认会话工作区 workspace/chat/{user_id}/{conversation_id}/{attachment_id}{ext}
  # 单文件大小上限（字节），默认 5MB，优先支持一次性读取直传 Agent
  max_bytes: 5242880
  # 单文件提取文本上限（字符），超限上传时直接拒绝，保证可一次性完整读入
  max_extract_chars: 12000
  # 单条消息允许附带的最多附件数
  max_per_message: 3

#===============================联网搜索配置（可选）===============================
search:
  # provider 为空或 api_key 为空时不注册搜索工具，Agent 也就不会尝试联网。
  # 支持：tavily
  provider: ${SEARCH_PROVIDER}
  api_key: ${SEARCH_API_KEY}
  base_url: ${SEARCH_BASE_URL}
